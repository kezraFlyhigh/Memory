<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>I Packed My Suitcase</title>
    <link rel="manifest" href="manifest.json">
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script>
        const { useState, useEffect, createElement: e } = React;

        const wordList = [
            'toothbrush', 'sunglasses', 'book', 'camera', 'phone', 'keys', 'wallet',
            'umbrella', 'hat', 'scarf', 'gloves', 'socks', 'shoes', 'jacket',
            'charger', 'headphones', 'snacks', 'water', 'map', 'notebook',
            'pen', 'laptop', 'tablet', 'passport', 'tickets', 'medicine',
            'sunscreen', 'towel', 'swimsuit', 'flip-flops', 'backpack', 'watch',
            'flashlight', 'batteries', 'candy', 'gum', 'tissues', 'sanitizer',
            'bandages', 'sweater', 'pajamas', 'toothpaste', 'shampoo', 'soap',
            'comb', 'mirror', 'deodorant', 'perfume', 'jewelry', 'belt'
        ];

        function BriefcaseIcon() {
            return e('svg', {
                xmlns: 'http://www.w3.org/2000/svg',
                width: 32, height: 32,
                viewBox: '0 0 24 24',
                fill: 'none',
                stroke: 'currentColor',
                strokeWidth: '2',
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                className: 'text-indigo-600'
            },
                e('rect', { width: '20', height: '14', x: '2', y: '7', rx: '2', ry: '2' }),
                e('path', { d: 'M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16' })
            );
        }

        function RecallModal({ onSubmit, onCancel }) {
            const [value, setValue] = useState('');
            return e('div', {
                className: 'fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4'
            },
                e('div', { className: 'bg-white rounded-xl p-6 w-full max-w-md shadow-xl' },
                    e('h2', { className: 'text-xl font-bold text-gray-800 mb-2' }, 'Test Your Memory'),
                    e('p', { className: 'text-sm text-gray-600 mb-4' }, 'Type all items separated by commas (any order):'),
                    e('textarea', {
                        className: 'w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4 resize-none text-base',
                        rows: 3,
                        value,
                        onChange: ev => setValue(ev.target.value),
                        placeholder: 'e.g. passport, shoes, camera',
                        autoFocus: true
                    }),
                    e('div', { className: 'flex gap-3' },
                        e('button', {
                            onClick: () => onSubmit(value),
                            className: 'flex-1 px-4 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium text-base'
                        }, 'Submit'),
                        e('button', {
                            onClick: onCancel,
                            className: 'px-4 py-3 bg-gray-400 text-white rounded-lg hover:bg-gray-500 font-medium text-base'
                        }, 'Cancel')
                    )
                )
            );
        }

        function SuitcaseGame() {
            const getInitialWord = () => wordList[Math.floor(Math.random() * wordList.length)];
            const [items, setItems] = useState(() => [getInitialWord()]);
            const [gameState, setGameState] = useState('playing');
            const [message, setMessage] = useState('');
            const [hiddenWords, setHiddenWords] = useState(new Set());
            const [userAnswer, setUserAnswer] = useState('');
            const [showModal, setShowModal] = useState(false);

            useEffect(() => {
                const timers = items.map((_, index) => {
                    if (!hiddenWords.has(index)) {
                        return setTimeout(() => {
                            setHiddenWords(prev => new Set([...prev, index]));
                        }, 5000);
                    }
                    return null;
                });
                return () => timers.forEach(t => t && clearTimeout(t));
            }, [items]);

            const addRandomItem = () => {
                const available = wordList.filter(w => !items.includes(w));
                if (available.length === 0) {
                    setMessage('No more unique items available!');
                    return;
                }
                const newItems = [...items, available[Math.floor(Math.random() * available.length)]];
                setItems(newItems);
                setHiddenWords(new Set());
                setMessage('Item added! Now remember all ' + newItems.length + ' items.');
            };

            const openRecallModal = () => {
                setHiddenWords(new Set(items.map((_, i) => i)));
                setShowModal(true);
            };

            const handleRecallSubmit = (input) => {
                setShowModal(false);
                setUserAnswer(input);
                const userItems = input.split(',').map(i => i.trim().toLowerCase()).filter(Boolean).sort();
                const correctItems = [...items].sort();
                if (JSON.stringify(userItems) === JSON.stringify(correctItems)) {
                    setMessage('ðŸŽ‰ Perfect! You remembered all items! Adding another...');
                    setGameState('won');
                    setTimeout(() => {
                        addRandomItem();
                        setGameState('playing');
                        setUserAnswer('');
                    }, 2000);
                } else {
                    setMessage('âŒ Not quite right. Check your answer below.');
                    setGameState('lost');
                }
            };

            const handleRecallCancel = () => {
                setShowModal(false);
                setHiddenWords(new Set());
            };

            const showAllWords = () => {
                setHiddenWords(new Set());
                setMessage('ðŸ’¡ All words revealed!');
            };

            const resetGame = () => {
                setItems([wordList[Math.floor(Math.random() * wordList.length)]]);
                setGameState('playing');
                setMessage('');
                setHiddenWords(new Set());
                setUserAnswer('');
            };

            const renderSentence = () => {
                return e('div', { className: 'text-lg leading-relaxed' },
                    e('span', { className: 'font-semibold' }, 'I packed my suitcase and in it I put '),
                    ...items.map((item, index) =>
                        e(React.Fragment, { key: index },
                            e('span', {
                                className: 'transition-all duration-500 ' + (
                                    hiddenWords.has(index)
                                        ? 'bg-gray-800 text-gray-800 select-none'
                                        : 'text-blue-600 font-medium'
                                )
                            }, hiddenWords.has(index) ? 'â– â– â– â– ' : item),
                            index < items.length - 1 ? e('span', null, ', ') : null
                        )
                    ),
                    e('span', null, '.')
                );
            };

            return e('div', { className: 'min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 md:p-8' },
                showModal && e(RecallModal, { onSubmit: handleRecallSubmit, onCancel: handleRecallCancel }),
                e('div', { className: 'max-w-3xl mx-auto' },
                    e('div', { className: 'bg-white rounded-xl shadow-lg p-6 md:p-8' },
                        e('div', { className: 'flex items-center justify-center gap-3 mb-6' },
                            e(BriefcaseIcon),
                            e('h1', { className: 'text-2xl md:text-3xl font-bold text-gray-800' }, 'I Packed My Suitcase')
                        ),
                        e('div', { className: 'bg-indigo-50 rounded-lg p-6 mb-6' },
                            renderSentence()
                        ),
                        e('div', { className: 'text-sm text-gray-600 mb-6 bg-yellow-50 p-4 rounded-lg border border-yellow-200' },
                            'âš ï¸ ',
                            e('strong', null, 'Remember: '),
                            'Each word hides after 5 seconds!'
                        ),
                        message && e('div', {
                            className: 'mb-6 p-4 rounded-lg ' + (
                                gameState === 'won' ? 'bg-green-50 text-green-800' :
                                gameState === 'lost' ? 'bg-red-50 text-red-800' :
                                'bg-blue-50 text-blue-800'
                            )
                        }, message),
                        userAnswer && gameState !== 'playing' && e('div', {
                            className: 'mb-6 p-4 rounded-lg bg-gray-50 border border-gray-300'
                        },
                            e('div', { className: 'font-semibold text-gray-700 mb-1' }, 'Your Answer:'),
                            e('div', { className: 'text-gray-800 mb-3' }, userAnswer),
                            e('div', { className: 'font-semibold text-gray-700 mb-1' }, 'Correct Answer:'),
                            e('div', { className: 'text-gray-800' }, items.join(', '))
                        ),
                        gameState === 'playing' && e('div', { className: 'mb-6 flex gap-3' },
                            e('button', {
                                onClick: addRandomItem,
                                className: 'flex-1 px-4 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors font-medium text-base'
                            }, 'Add Random Item'),
                            e('button', {
                                onClick: showAllWords,
                                className: 'flex-1 px-4 py-3 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 transition-colors font-medium text-base'
                            }, 'Show All Words')
                        ),
                        e('div', { className: 'flex gap-3 mb-4' },
                            e('button', {
                                onClick: openRecallModal,
                                disabled: gameState !== 'playing',
                                className: 'flex-1 px-4 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors font-medium text-base disabled:bg-gray-400 disabled:cursor-not-allowed'
                            }, 'Test My Memory'),
                            e('button', {
                                onClick: resetGame,
                                className: 'px-4 py-3 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors font-medium text-base'
                            }, 'Reset')
                        ),
                        e('div', { className: 'mt-6 text-sm text-gray-600' },
                            e('strong', null, 'How to play:'),
                            e('ol', { className: 'list-decimal list-inside mt-2 space-y-1' },
                                e('li', null, 'Memorize the current list of items'),
                                e('li', null, 'Click "Add Random Item" to grow the list'),
                                e('li', null, 'Words disappear after 5 seconds!'),
                                e('li', null, 'Use "Show All Words" for a hint'),
                                e('li', null, 'Click "Test My Memory" and type all items (any order)')
                            )
                        )
                    )
                )
            );
        }

        ReactDOM.render(e(SuitcaseGame), document.getElementById('root'));
    </script>
</body>
</html>
